[build]
  base = "new/cab-frontend"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "build"

[build.environment]
  # Prevent CRA from failing the build on lint warnings
  CI = "false"

# Single-page app: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
