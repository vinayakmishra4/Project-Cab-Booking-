<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CABGO | Employer Registration</title>

    <link rel="stylesheet" href="/frontend/createloginemployer/style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div class="logo">

                <span class="logo-m">M</span>

                <span class="logo-text">CABGO</span>

            </div>

            <p>Employer Registration Portal</p>

        </div>

        <!-- Registration Form -->

        <div class="form-container">

            <h2>Create Employer Account</h2>

            <p class="subtitle">

                Register your employer account to access CABGO services.

            </p>

            <form id="registerForm">

                <!-- Employer ID -->

                <div class="input-group">

                    <label for="employerId">Employer ID</label>

                    <input type="text" id="employerId" placeholder="Enter Employer ID" required>

                </div>

                <!-- Employer Name -->

                <div class="input-group">

                    <label for="employerName">Employer Name</label>

                    <input type="text" id="employerName" placeholder="Enter Employer Name" required>

                </div>

                <!-- Email -->

                <div class="input-group">

                    <label for="email">Email Address</label>

                    <input type="email" id="email" placeholder="Enter Email Address" required>

                </div>

                <!-- Address -->

                <div class="input-group">

                    <label for="address">Employer Address</label>

                    <textarea id="address" placeholder="Enter Complete Address" required></textarea>

                </div>

                <!-- Password -->

                <div class="input-group">

                    <label for="password">Password</label>

                    <div class="password-box">

                        <input type="password" id="password" placeholder="Create Password" minlength="8" required>

                        <span class="toggle-password" onclick="togglePassword('password', this)">

                            SHOW

                        </span>

                    </div>

                </div>

                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">

                        Confirm Password

                    </label>

                    <div class="password-box">

                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                        <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">

                            SHOW

                        </span>

                    </div>

                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="register-btn">
                    CREATE ACCOUNT
                </button>

                <!-- Message -->

                <p id="message"></p>

            </form>

            <!-- Login Link -->

            <div class="login-link">

                Already have an account?

                <a href="/frontend/employeerloginpage/index.html">Login Here</a>

            </div>

        </div>

        <!-- Footer -->

        <div class="footer">

            © 2026 CABGO | All Rights Reserved

        </div>

    </div>

    <script src="/frontend/createloginemployer/script.js"></script>

</body>

</html>
